name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build-and-check:
    name: Build and check
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      DATABASE_URL: mysql://ci:ci@localhost:3306/liederbuch
      NEXTAUTH_SECRET: ci-nextauth-secret
      NEXTAUTH_URL: http://localhost:3000
      DISCORD_CLIENT_ID: ci-discord-client-id
      DISCORD_CLIENT_SECRET: ci-discord-client-secret
      GITHUB_OWNER: ci
      GITHUB_LIEDERBUCH_REPO: liederbuch
      GITHUB_LIEDERBUCH_TOKEN: ci-github-token

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm run test

      - name: Validate song templates
        run: npm run validate:songs

      - name: Build
        run: npm run build
